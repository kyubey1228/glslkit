<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>glslkit-webgl compile error demo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
      gap: 20px; padding: 32px 16px;
      background: radial-gradient(circle at 50% 15%, #1c1430, #05060c 70%);
      font: 15px/1.6 system-ui, sans-serif; color: #ece9ff;
    }
    h1 {
      font-size: 14px; letter-spacing: .1em; text-transform: uppercase; color: #b9a6ff;
      margin: 0; text-align: center;
    }
    canvas {
      width: min(70vw, 480px); height: min(70vw, 480px); border-radius: 14px;
      box-shadow: 0 0 60px #6b2bff22, inset 0 0 0 1px #ffffff14; background: #0a0a12;
    }
    #status { font-size: 13px; color: #8f88b8; min-height: 1.2em; text-align: center; }
    #panel {
      width: min(92vw, 640px); border: 1px solid #3a2f66; border-radius: 12px;
      background: #12101f; padding: 20px 24px; display: none;
    }
    #panel.visible { display: block; }
    #panel h2 {
      margin: 0 0 14px; font-size: 13px; color: #ff6b81; letter-spacing: .08em;
      text-transform: uppercase;
    }
    .row { display: flex; gap: 12px; margin: 8px 0; font-size: 14px; align-items: baseline; }
    .row .label {
      width: 64px; flex: none; color: #8f88b8; font-size: 11px; letter-spacing: .06em;
      text-transform: uppercase;
    }
    .row .value { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    #err-file { color: #ffd166; font-weight: 700; font-size: 16px; }
    /* 抜粋が取得できたときだけ枠を出す(fetch失敗時に空の帯が残らないように)。 */
    #excerpt.has-content {
      margin-top: 14px; background: #0a0a12; border-radius: 8px; padding: 10px 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px;
      color: #a9a3d6; overflow-x: auto;
    }
    #excerpt .line { display: block; padding: 1px 14px; white-space: pre; }
    #excerpt .line.error-line { background: #4a1030; color: #ffb3c6; }
    details { margin-top: 14px; }
    summary { cursor: pointer; color: #8f88b8; font-size: 12.5px; }
    #err-raw-log {
      white-space: pre-wrap; background: #0a0a12; border-radius: 8px; padding: 12px;
      margin-top: 8px; font-size: 12px; color: #8f88b8; overflow-x: auto;
    }
    button {
      background: #6b2bff; color: white; border: none; border-radius: 8px; padding: 10px 20px;
      font: inherit; font-weight: 600; cursor: pointer; margin-top: 18px;
    }
    button:hover { background: #7c40ff; }
  </style>
</head>
<body>
  <h1>glslkit-webgl &middot; compile error &rarr; original file &amp; line</h1>
  <canvas id="canvas" width="480" height="480"></canvas>
  <p id="status">読み込み中&hellip;</p>

  <div id="panel">
    <h2>Shader compile error</h2>
    <div class="row"><span class="label">stage</span><span class="value" id="err-stage"></span></div>
    <div class="row"><span class="label">file</span><span class="value" id="err-file"></span></div>
    <div class="row"><span class="label">line</span><span class="value" id="err-line"></span></div>
    <div class="row"><span class="label">message</span><span class="value" id="err-message"></span></div>
    <div id="excerpt"></div>
    <details>
      <summary>raw compiler log</summary>
      <pre id="err-raw-log"></pre>
    </details>
    <button id="retry">正常版に切り替えて描画する</button>
  </div>

  <script src="../shim/glslkit-webgl.js" data-entry="./neon-error.rb"></script>
</body>
</html>
